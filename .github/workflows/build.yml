name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    container: texlive/texlive:TL2025-historic
    steps:
      - uses: actions/checkout@v4

      - name: Build PDFs (en, ja)
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: notes-pdf
          path: dist/*.pdf
          if-no-files-found: error

      # Publish the PDFs to the orphan branch `pdf` (one commit, force-pushed)
      # so they can be read in the browser without downloading:
      #   https://github.com/<owner>/<repo>/blob/pdf/notes-en.pdf
      - name: Publish PDFs to the pdf branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pdf
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "PDFs for ${{ github.sha }}"

      - name: Attach PDFs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
