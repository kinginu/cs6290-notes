name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a build still running for the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    container: texlive/texlive:TL2025-historic
    steps:
      - uses: actions/checkout@v4

      - name: Build PDFs (en, ja)
        run: make dist

      - name: Generate index.html for GitHub Pages
        run: sh .github/scripts/pdf-index.sh "${{ github.event.repository.name }}" "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: notes-pdf
          path: dist/
          if-no-files-found: error

      # Publish the PDFs to the orphan branch `pdf` (one commit, force-pushed).
      # Readable at https://github.com/<owner>/<repo>/blob/pdf/notes-en.pdf, or,
      # with GitHub Pages enabled on that branch, at
      #   https://<owner>.github.io/<repo>/  (index.html links to both PDFs)
      - name: Publish PDFs to the pdf branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pdf
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "PDFs for ${{ github.sha }}"

      - name: Attach PDFs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
